[workspace]
members = [
    "crates/takt-engine",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Optimize audio decoding & DSP dependencies even in `tauri dev`
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.takt-engine]
opt-level = 3

