[package]
name = "takt-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "takt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
takt-engine = { path = "../crates/takt-engine" }
tauri = { version = "2", features = [] }

